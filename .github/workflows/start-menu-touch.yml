name: Seven Start menu touch regression
on:
  push:
    branches: [fix/seven-start-menu-touch]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seven-start-touch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Seven preservation
        run: python3 checks/CheckSevenBaseline.py --version-name 0.7.4 --version-code 27
      - name: Build current app, native tests and disposable app; run unit tests
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug --no-daemon
      - name: Build the exact reported 0.7.3 version with the same CI test key
        run: |
          git fetch --no-tags --depth=1 origin c56499b4016930add94eef81b80c64a337c5f642
          mkdir -p build/start-baseline
          git archive c56499b4016930add94eef81b80c64a337c5f642 | tar -x -C build/start-baseline
          ./gradlew -p build/start-baseline :app:assembleDebug --no-daemon
      - name: Verify native registrations
        run: python3 checks/CheckTestManifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: Seven-0.7.4-build-api-${{ matrix.api }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/testDebugUnitTest/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          emulator-build: 15917651
          arch: x86_64
          target: ${{ matrix.api == 30 && 'default' || 'aosp_atd' }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 300
          script: bash checks/run-seven-start-touch.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Seven-0.7.4-start-touch-api-${{ matrix.api }}
          path: build/start-touch-evidence/
