name: Android build
on:
  push:
    branches: [main, feature/nth-desktop-seven]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check launcher state and layout geometry
        run: |
          mkdir -p build/state-check
          javac -d build/state-check app/src/main/java/com/nthexperience/desktop/LauncherState.java checks/LauncherStateCheck.java app/src/main/java/com/nthexperience/desktop/DesktopGeometry.java checks/DesktopGeometryCheck.java app/src/main/java/com/nthexperience/desktop/StartupPolicy.java checks/StartupPolicyCheck.java app/src/main/java/com/nthexperience/desktop/GadgetMath.java checks/GadgetMathCheck.java app/src/main/java/com/nthexperience/desktop/BrowserUrls.java checks/BrowserUrlsCheck.java app/src/main/java/com/nthexperience/desktop/DesktopMetrics.java checks/DesktopMetricsCheck.java app/src/main/java/com/nthexperience/desktop/ControlPanelCatalog.java checks/ControlPanelCatalogCheck.java app/src/main/java/com/nthexperience/desktop/AeroSnap.java app/src/main/java/com/nthexperience/desktop/WindowArrangement.java checks/WindowArrangementCheck.java app/src/main/java/com/nthexperience/desktop/TaskbarGrouping.java app/src/main/java/com/nthexperience/desktop/TaskbarFlick.java checks/TaskbarGroupingCheck.java app/src/main/java/com/nthexperience/desktop/TaskbarOrder.java app/src/main/java/com/nthexperience/desktop/TaskbarColors.java app/src/main/java/com/nthexperience/desktop/SoundSchemes.java checks/SevenPolishCheck.java
          java -cp build/state-check LauncherStateCheck
          java -cp build/state-check DesktopGeometryCheck
          java -cp build/state-check StartupPolicyCheck
          java -cp build/state-check com.nthexperience.desktop.GadgetMathCheck
          java -cp build/state-check com.nthexperience.desktop.BrowserUrlsCheck
          java -cp build/state-check com.nthexperience.desktop.DesktopMetricsCheck
          java -cp build/state-check com.nthexperience.desktop.ControlPanelCatalogCheck
          java -cp build/state-check com.nthexperience.desktop.WindowArrangementCheck
          java -cp build/state-check com.nthexperience.desktop.SevenPolishCheck
          java -cp build/state-check com.nthexperience.desktop.TaskbarGroupingCheck
      - run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Check out the pinned Vista baseline for the side-by-side test
        uses: actions/checkout@v4
        with:
          repository: bdredenbach/Windows-Vista-Style-Android-Launcher
          ref: 7c3fd109ac1fae51486c8f645b5f7cba7370bdeb
          path: vista-baseline
          persist-credentials: false
      - name: Build the pinned Vista baseline
        run: ./gradlew -p vista-baseline :app:assembleDebug --no-daemon
      - name: Check packaged test registrations
        run: python3 checks/CheckTestManifest.py
      - uses: actions/upload-artifact@v4
        if: matrix.api == 30
        with:
          name: Nth-Desktop-Seven-0.6.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Keep APK verification tool for the handoff
        if: matrix.api == 30
        run: |
          mkdir -p build/signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/signing-tool/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: matrix.api == 30
        with:
          name: APK-verification-tool
          path: build/signing-tool/apksigner.jar
      - name: Prepare local Java compile kit
        if: matrix.api == 30
        run: python3 checks/PrepareCompileKit.py
      - uses: actions/upload-artifact@v4
        if: matrix.api == 30
        with:
          name: Android-compile-kit
          path: build/compile-kit/
      - name: Check public gadget services
        if: matrix.api == 30
        run: python3 checks/CheckPublicGadgetServices.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run launcher smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          emulator-build: 15917651
          arch: x86_64
          target: ${{ matrix.api == 30 && 'default' || 'aosp_atd' }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            bash checks/run-emulator-checks.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Launcher-emulator-evidence-${{ matrix.api }}
          path: |
            public-service-checks.json
            side-by-side-test.txt
            snap-test.txt
            seven-polish-test.txt
            resize-test.txt
            smoke-test.txt
            aero-test.txt
            gadgets-test.txt
            desktop-top-test.txt
            explorer-test.txt
            storage-test.txt
            home-upgrade-test.txt
            storage-setup-test.txt
            storage-access-test.txt
            file-open-blocked-test.txt
            file-open-test.txt
            browser-test.txt
            photo-test.txt
            extras-test.txt
            media-test.txt
            usability-test.txt
            brightness-test.txt
            fidelity-test.txt
            polish-test.txt
            authenticity-test.txt
            continuity-test.txt
            reboot-test.txt
            screenshots/
